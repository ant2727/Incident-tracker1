spring:
  application:
    name: incident-tracker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret}
  expiration-minutes: 60
  refresh-expiration-days: 7 # TODO: não implementado ainda

app:
  admin:
    email: ${ADMIN_EMAIL:admin@incidenttracker.local}
    password: ${ADMIN_PASSWORD:changeme123}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.seunome.incidenttracker: DEBUG